name: MoodStream
options:
  bundleIdPrefix: com.baristageek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MoodStream:
    type: application
    platform: iOS
    sources:
      - MoodStream
    info:
      path: MoodStream/Info.plist
      properties:
        CFBundleDisplayName: MoodStream
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOODSTREAM_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  MoodStreamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MoodStreamTests
    dependencies:
      - target: MoodStream
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MOODSTREAM_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MoodStream:
    build:
      targets:
        MoodStream: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MoodStreamTests
